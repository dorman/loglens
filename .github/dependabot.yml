version: 2

updates:
  # Workflow actions are pinned to commit SHAs, so security fixes upstream no
  # longer arrive on their own. Dependabot understands the `# vX.Y.Z` comments
  # and bumps both the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    # Only minor and patch bumps are batched. Majors arrive as one PR each so
    # a breaking change is attributable and revertable on its own: #34 grouped
    # four majors, three of which touched release.yml, which no pull-request
    # check exercises.
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
