name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.1). Leave empty when pushing a tag."
        required: false
        default: ""

# No job gets any token scope by default; each opts into exactly what it needs
# below. A job added later without a `permissions:` block therefore fails
# closed rather than silently inheriting access.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Checkout only. The matrix compiles third-party crate code on four
    # runners and never writes back to the repository.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      # persist-credentials: false keeps the job token out of .git/config, so a
      # later step cannot sweep it into a published archive. No job here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Deliberately not caching. A restored cache is writable by any branch
      # build, so reusing one here would let unreviewed code influence the
      # binaries users download. Release builds start clean; CI keeps its cache.

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          BIN=loglens
          EXT=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            EXT=".exe"
          fi
          STAGE="loglens-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${BIN}${EXT}" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "${STAGE}.zip" "$STAGE"
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${STAGE}.tar.gz" "$STAGE"
            echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loglens-${{ matrix.target }}
          path: ${{ env.ASSET }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # The only job that writes: it creates the release and uploads the assets.
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Flatten assets
        shell: bash
        run: |
          mkdir -p assets
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} assets/ \;
          ls -la assets

      # Publish checksums alongside the archives so `scripts/install.sh` (and
      # anyone downloading by hand) can verify what they fetched.
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: loglens ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
